<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil | Ste Mondial Parfums</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
      --cream: #F5F2EB;
      --cream-dark: #EBE7DC;
      --cream-deep: #DFD9C8;
      --gold: #C56D56;
      --gold-light: #E5A18C;
      --gold-dark: #923F2B;
      --charcoal: #1D1530;
      --text-mid: #645C75;
      --white: #FAF8F4;
      --card-base: #EFECE2;
      --card-warm: #E8E3D5;
      --card-elevated: #FDFCF9;
      --card-shadow: rgba(40, 30, 60, 0.08);
      --border-light: rgba(197, 109, 86, 0.15);
      --border-medium: rgba(197, 109, 86, 0.28);
      --shadow-sm: 0 2px 8px rgba(40, 30, 60, 0.04);
      --shadow-md: 0 6px 20px rgba(40, 30, 60, 0.06);
      --shadow-lg: 0 14px 32px rgba(40, 30, 60, 0.08);
      --shadow-hover: 0 20px 44px rgba(40, 30, 60, 0.10);
      --input-bg: #FAF8F5;
      --input-border: #D4CDBE;
      --input-focus: #C56D56;
      --hover-subtle: rgba(197, 109, 86, 0.08);
      --hover-medium: rgba(197, 109, 86, 0.14);
    }
    body.dark {
      --cream: #0C0A17;
      --cream-dark: #131024;
      --cream-deep: #1D1936;
      --gold: #E0856E;
      --gold-light: #FFA38E;
      --gold-dark: #B5523A;
      --charcoal: #EDE9FA;
      --text-mid: #9A92B3;
      --white: #0C0A17;
      --card-base: #131024;
      --card-warm: #1B1630;
      --card-elevated: #241E40;
      --card-shadow: rgba(0, 0, 0, 0.5);
      --border-light: rgba(224, 133, 110, 0.20);
      --border-medium: rgba(224, 133, 110, 0.35);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 14px 32px rgba(0, 0, 0, 0.5);
      --shadow-hover: 0 20px 44px rgba(0, 0, 0, 0.6);
      --input-bg: #1B1630;
      --input-border: #2E274F;
      --input-focus: #E0856E;
      --hover-subtle: rgba(224, 133, 110, 0.12);
      --hover-medium: rgba(224, 133, 110, 0.22);
    }
    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 800px; margin: 40px auto; padding: 2rem; width: 90%; background: var(--card-warm); border-radius: 24px; box-shadow: var(--shadow-md); border: 1px solid var(--border-light); }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; margin-bottom: 1.5rem; color: var(--gold-dark); text-align: center; }
    .profile-info { margin-bottom: 1.5rem; font-size: 0.95rem; }
    .profile-info span { font-weight: 500; color: var(--gold-dark); }
    .btn { display: inline-block; padding: 10px 24px; background: var(--gold-dark); color: var(--white); border: none; border-radius: 50px; cursor: pointer; text-decoration: none; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; transition: 0.3s; }
    .btn:hover { background: var(--charcoal); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mon Profil</h1>
    <div class="profile-info" id="userInfo">Chargement des informations...</div>
    <a href="index.html" class="btn"><i class="fas fa-arrow-left"></i> Retour à la boutique</a>
  </div>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
    }
    const user = JSON.parse(localStorage.getItem('theworld_user') || 'null');
    const container = document.getElementById('userInfo');
    if (user) {
      container.innerHTML = `<p><span>Nom / Email:</span> ${user.email || user.name || 'Client'}</p>`;
    } else {
      container.innerHTML = `<p>Aucun utilisateur connecté.</p><br><a href="index.html" class="btn">Se connecter</a>`;
    }
  </script>
</body>
</html>
