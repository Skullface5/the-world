<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil | Ste Mondial Parfums</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
      --cream: #F2F4F0;
      --cream-dark: #E3E8DF;
      --cream-deep: #D5DBD0;
      --gold: #C2A677;
      --gold-light: #DBC7A6;
      --gold-dark: #8A734D;
      --charcoal: #2D352A;
      --text-mid: #5F6B5A;
      --white: #F8FAF6;
      --card-base: #EAEFE6;
      --card-warm: #E1E7DB;
      --card-elevated: #FAFCFA;
      --card-shadow: rgba(60, 75, 55, 0.08);
      --border-light: rgba(95, 107, 90, 0.15);
      --border-medium: rgba(95, 107, 90, 0.28);
      --shadow-sm: 0 2px 8px rgba(60, 75, 55, 0.04);
      --shadow-md: 0 6px 20px rgba(60, 75, 55, 0.06);
      --shadow-lg: 0 14px 32px rgba(60, 75, 55, 0.08);
      --shadow-hover: 0 20px 44px rgba(60, 75, 55, 0.10);
      --input-bg: #FAFCFA;
      --input-border: #C8D2C2;
      --input-focus: #8A734D;
      --hover-subtle: rgba(194, 166, 119, 0.08);
      --hover-medium: rgba(194, 166, 119, 0.14);
    }
    body.dark {
      --cream: #131811;
      --cream-dark: #1B2218;
      --cream-deep: #242D20;
      --gold: #D0BA90;
      --gold-light: #E8DCC4;
      --gold-dark: #9B845C;
      --charcoal: #E6EDE2;
      --text-mid: #899684;
      --white: #131811;
      --card-base: #1B2218;
      --card-warm: #242D20;
      --card-elevated: #2E3A2A;
      --card-shadow: rgba(0, 0, 0, 0.5);
      --border-light: rgba(208, 186, 144, 0.20);
      --border-medium: rgba(208, 186, 144, 0.35);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 14px 32px rgba(0, 0, 0, 0.5);
      --shadow-hover: 0 20px 44px rgba(0, 0, 0, 0.6);
      --input-bg: #242D20;
      --input-border: #394833;
      --input-focus: #D0BA90;
      --hover-subtle: rgba(208, 186, 144, 0.12);
      --hover-medium: rgba(208, 186, 144, 0.22);
    }
    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 800px; margin: 40px auto; padding: 2rem; width: 90%; background: var(--card-warm); border-radius: 24px; box-shadow: var(--shadow-md); border: 1px solid var(--border-light); }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; margin-bottom: 1.5rem; color: var(--gold-dark); text-align: center; }
    .profile-info { margin-bottom: 1.5rem; font-size: 0.95rem; }
    .profile-info span { font-weight: 500; color: var(--gold-dark); }
    .btn { display: inline-block; padding: 10px 24px; background: var(--gold-dark); color: var(--white); border: none; border-radius: 50px; cursor: pointer; text-decoration: none; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; transition: 0.3s; }
    .btn:hover { background: var(--charcoal); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mon Profil</h1>
    <div class="profile-info" id="userInfo">Chargement des informations...</div>
    <a href="index.html" class="btn"><i class="fas fa-arrow-left"></i> Retour à la boutique</a>
  </div>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
    }
    const user = JSON.parse(localStorage.getItem('theworld_user') || 'null');
    const container = document.getElementById('userInfo');
    if (user) {
      container.innerHTML = `<p><span>Nom / Email:</span> ${user.email || user.name || 'Client'}</p>`;
    } else {
      container.innerHTML = `<p>Aucun utilisateur connecté.</p><br><a href="index.html" class="btn">Se connecter</a>`;
    }
  </script>
</body>
</html>
