<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title data-i18n="productTitle">Produit — The World</title>
<link rel="apple-touch-icon" sizes="180x180" href="../i/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../i/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../i/favicon-16x16.png">
<link rel="manifest" href="../i/site.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../css/product.css">
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <a href="../#top" class="brand">
      <div class="brand-mark">
        <img src="../i/ste-mondial-perfumes.png" alt="The World" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span style="display:none">TW</span>
      </div>
      <div class="brand-name"><b data-i18n="brandName">The World</b><small data-i18n="brandSub">Maison de Parfums</small></div>
    </a>
    <div class="header-actions">
      <div class="cart-switch">
        <button class="icon-btn" id="cartToggle" aria-label="Panier"><i class="fas fa-shopping-bag"></i></button>
        <span class="cart-count" id="cartCount">0</span>
      </div>
    </div>
  </div>
</header>

<main class="product-wrap" id="productWrap">
  <div class="product-placeholder" id="productPlaceholder"><span data-i18n="productLoading">Chargement…</span></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <small>&copy; <span id="year"></span> The World — <span data-i18n="footerRights">Tous droits réservés.</span></small>
  </div>
</footer>

<!-- CART OVERLAY -->
<div class="overlay cart-overlay" id="cartOverlay">
  <div class="overlay-panel cart-panel">
    <button class="overlay-close" id="cartClose"><i class="fas fa-times"></i></button>
    <h2 data-i18n="cartTitle">Votre panier</h2>
    <div class="cart-body" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total"><span data-i18n="cartTotal">Total</span> <strong id="cartTotalValue">0,000 TND</strong></div>
      <button class="btn-solid" id="checkoutBtn" data-i18n="cartCheckout">Commander</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/product.js"></script>
</body>
</html>
